<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Login</title>
        <style>
            * {
                margin: 0;
                box-sizing: border-box;
            }

            body {
                background: url('Food Photo/foodbackground.jpg');
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
                font-family: Arial, sans-serif;
            }

            .nav {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                box-shadow: 5px 8px 10px rgba(0, 0, 0, 0.1);
                height: 70px;
                background-color: bisque;
                z-index: 1000;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0 20px;
            }

            .logo {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 20px;
                font-weight: bold;
                font-family: 'Courier New', Courier, monospace;
                color: #333;
            }

            .logo-link {
                display: flex;
                align-items: center;
                gap: 10px;
                text-decoration: none;
                color: inherit;
            }

            .logo-icon {
                width: 38px;
                height: 38px;
                background-color: #ff7043;
                color: white;
                border-radius: 50%;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 20px;
                box-shadow: 0px 3px 6px rgba(255, 112, 67, 0.4);
            }

            .nav ul {
                list-style: none;
                display: flex;
            }

            .nav ul li {
                padding: 0 15px;
            }

            .nav ul li a {
                text-decoration: none;
                color: black;
                cursor: pointer;
                font-size: 20px;
                font-weight: bold;
            }

            .nav ul li a:hover {
                text-decoration: underline;
            }
        
            .login {
                width: 480px;
                background: rgba(255, 255, 255, 0.95);
                margin: 140px auto 80px auto;
                padding: 55px 45px;
                border-radius: 35px;
                box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.35);
                border: 2px solid #ffcca1;
            }

            .title {
                text-align: center;
                font-size: 30px;
                font-weight: bold;
                margin-bottom: 30px;
                color: #333;
                font-family: 'Courier New', Courier, monospace;
            }

            .email {
                margin-bottom: 25px;
            }

            .email label {
                display: block;
                margin-bottom: 10px;
                font-size: 16px;
                font-weight: bold;
                color: #555;
            }

            .email input {
                width: 100%;
                height: 55px;
                padding: 0 18px;
                font-size: 17px;
                border: 2px solid #ffcca1;
                border-radius: 14px;
                outline: none;
                transition: 0.3s;
            }

            .email input:focus {
                border-color: #ff7043;
                box-shadow: 0 0 5px rgba(255, 112, 67, 0.3);
            }

            .button {
                width: 100%;
                height: 55px;
                background-color: #ff8a65;
                color: white;
                font-size: 19px;
                font-weight: bold;
                border: none;
                border-radius: 14px;
                cursor: pointer;
            }

            .button:hover {
                background-color: #ff7043;
            }

            .signup {
                text-align: center;
                margin-top: 20px;
                font-size: 16px;
            }

            .signup a {
                color: #ff7043;
                text-decoration: none;
                font-weight: bold;
            }

            .signup a:hover {
                text-decoration: underline;
            }
            
            .footer {
                color: white;
                text-align: center;
                padding: 10px;
                width: 100%;
                font-size: 26px;
                position: fixed;
                bottom: 0;
                left: 0;
                background-color: rgba(0, 0, 0, 0.7);
            }
        </style>
    </head>
    <body>
        
        <div class="nav">
            <div class="logo">
                <a href="index.html" class="logo-link"><div class="logo-icon">🍔</div>
                    <span>Tasty Vibes</span>
                </a> 
                    </div>
            <ul>
               
            </ul>
        </div>
        
        <div class="login">
            <div class="title">Welcome Back</div>
            <form action="home.html" method="GET">
                <div class="email">
                    <label>Email Address</label> 
                    <input type="email" placeholder="Enter your email" required>
                </div>
                
                <div class="email">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="button">Log In</button>
            </form>
            <br>
            <div class="signup">
                Don't have an account ? <a href="signup.html">Sign Up</a>
            </div>
        </div>

        <div class="footer">
            Copyright &copy; Developed By Htet Hlaing Win (Batch6-26).All right reserved.
        </div>

    </body>
</html>
